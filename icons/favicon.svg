<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#1C2620"/>

  <!-- roof: two-tone A-frame -->
  <polygon points="100,36 36,98 100,98" fill="#D9A54F"/>
  <polygon points="100,36 164,98 100,98" fill="#C08A3E"/>

  <!-- walls -->
  <rect x="54" y="98" width="92" height="68" rx="3" fill="#EFE8D8"/>

  <!-- window -->
  <circle cx="100" cy="132" r="30" fill="#1C2620"/>

  <!-- plate -->
  <circle cx="100" cy="132" r="21" fill="#EFE8D8"/>
  <circle cx="100" cy="132" r="15.5" fill="none" stroke="#CFC5AC" stroke-width="1.5"/>

  <!-- fork (left) -->
  <g transform="rotate(-9 88 132)">
    <line x1="88" y1="118" x2="88" y2="150" stroke="#1C2620" stroke-width="3" stroke-linecap="round"/>
    <line x1="83" y1="118" x2="83" y2="127" stroke="#1C2620" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="93" y1="118" x2="93" y2="127" stroke="#1C2620" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M83,127 Q88,131 93,127" fill="none" stroke="#1C2620" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- knife (right) -->
  <g transform="rotate(9 113 132)">
    <line x1="113" y1="150" x2="113" y2="128" stroke="#1C2620" stroke-width="3" stroke-linecap="round"/>
    <path d="M113,128 C113,118 121,116 121,116 C121,122 118,127 113,128 Z" fill="#1C2620"/>
  </g>
</svg>
